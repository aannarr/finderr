<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="utf-8" />
    <!-- `interactive-widget=resizes-content`: the soft keyboard SHRINKS the layout viewport
         instead of sliding over the page. Without it a focused field near the bottom is
         covered by the keyboard and the browser scrolls to compensate, which on iOS reads
         as the page lurching. There is deliberately no `maximum-scale` or `user-scalable=no`
         here: both have been IGNORED by iOS Safari since iOS 10, on purpose, because
         disabling pinch-zoom breaks the browser for anybody who needs to enlarge text. The
         only real cure for an unwanted zoom is to give Safari no reason to do it -- see the
         form-control block in styles.css. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#1A1C22" />
    <title>finderr</title>
    <link rel="preconnect" href="/img" />
    <!-- Icons are DERIVED from assets/brand/*.svg by `bun run icons:build`.
         Edit the SVG and re-run it; never hand-resize one of these. The .ico is
         the fallback for browsers that ignore rel="icon" with an SVG type. -->
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" sizes="any" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
