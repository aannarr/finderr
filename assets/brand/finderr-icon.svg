<!-- The app icon: the mark on the app's own background, in a rounded square sized
     to sit beside Radarr and Sonarr without looking like a different family.
     Colours are literals rather than the CSS custom properties, because this file
     is rendered by rsvg-convert and by the browser's favicon path, neither of
     which has the stylesheet. #16BE7D is the accent custom property from
     web/src/styles.css and #1A1C22 is the background one; keep them in step. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512"
     role="img" aria-label="finderr">
  <rect width="512" height="512" rx="114" fill="#1A1C22"/>
  <g transform="translate(256 256) scale(18) translate(-12 -12)"
     fill="none" stroke="#16BE7D" stroke-width="2.1"
     stroke-linecap="round" stroke-linejoin="round">
    <path d="M2 7 8 4l8 3 6-3v13l-6 3-8-3-6 3Z"/>
    <path d="M8 4v13M16 7v13"/>
    <path d="m10.3 10.3 3.4 3.4M13.7 10.3l-3.4 3.4"/>
  </g>
</svg>
